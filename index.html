<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>J&J OS — AI Service Business Platform</title>
<style>
:root{--bg:#f4f7f5;--panel:#fff;--ink:#13221a;--muted:#718078;--line:#e2e9e4;--brand:#16734a;--brand2:#0f5b3a;--soft:#e8f4ed;--danger:#b42318;--shadow:0 8px 28px #153d2a12}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}button{cursor:pointer}
.app{display:flex;min-height:100vh}.side{width:250px;background:#102019;color:#dce9e2;padding:22px 14px;position:fixed;inset:0 auto 0 0}
.logo{display:flex;gap:10px;align-items:center;padding:6px 10px 24px;font-weight:800;font-size:18px}.logo b{background:#2aa86e;color:white;border-radius:10px;padding:8px}
.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aebfb6;text-align:left;padding:12px 13px;border-radius:9px}.nav button:hover,.nav button.active{background:#1c382b;color:white}.nav button span{margin-right:10px}
.bottom{position:absolute;bottom:20px;left:14px;right:14px;background:#173126;border:1px solid #28483a;border-radius:12px;padding:13px;font-size:12px}
.main{margin-left:250px;width:calc(100% - 250px)}header{height:72px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5}
.search{border:1px solid var(--line);border-radius:9px;padding:9px 12px;width:290px}.user{display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--brand);font-weight:800}
.content{padding:28px;max-width:1500px;margin:auto}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.title h1{margin:0;font-size:28px}.title p{color:var(--muted);margin:5px 0 0}.btn{border:0;border-radius:8px;padding:10px 15px;background:var(--brand);color:white;font-weight:700}.btn.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#fff1f0;color:var(--danger)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:19px;box-shadow:var(--shadow)}.metric{font-size:27px;font-weight:800;margin-top:6px}.label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin-top:18px}.section{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}.sectionhead{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.sectionhead h3{margin:0}.job{padding:16px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.job:last-child{border:0}.jobname{font-weight:750}.sub{font-size:13px;color:var(--muted);margin-top:4px}.pill{padding:5px 8px;border-radius:999px;background:var(--soft);color:var(--brand2);font-size:11px;font-weight:800}.pill.orange{background:#fff5e6;color:#a15c00}.pill.gray{background:#edf0ee;color:#66736d}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}.action{background:#f8faf9;border:1px solid var(--line);border-radius:9px;padding:14px;text-align:left}.action b{display:block;margin-bottom:4px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:14px 18px;border-bottom:1px solid var(--line);font-size:14px}.table th{font-size:11px;color:var(--muted);text-transform:uppercase}.toolbar{display:flex;gap:10px;padding:15px;border-bottom:1px solid var(--line)}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:white}
.heroai{background:linear-gradient(135deg,#123d2a,#1d754d);color:white;border-radius:13px;padding:20px;margin-bottom:18px}.heroai small{opacity:.75}.airow{display:flex;gap:10px;margin-top:13px}.airow input{flex:1;border:0;border-radius:8px;padding:11px}.airow button{border:0;border-radius:8px;padding:11px 15px;font-weight:800}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px}.full{grid-column:1/-1}.total{font-size:25px;font-weight:800;text-align:right;padding:0 18px 18px}
.empty{padding:45px;text-align:center;color:var(--muted)}
.toast{position:fixed;right:24px;bottom:24px;background:#102019;color:white;padding:13px 17px;border-radius:9px;box-shadow:var(--shadow);display:none}
@media(max-width:900px){.side{width:72px}.logo span,.nav button span+*{display:none}.nav button{text-align:center}.main{margin-left:72px;width:calc(100% - 72px)}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.search{width:180px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="logo"><b>J&J</b><span>J&J OS</span></div>
<div class="nav" id="nav">
<button class="active" data-page="dashboard">▦ <span>Dashboard</span></button>
<button data-page="crm">♙ <span>CRM</span></button>
<button data-page="jobs">✓ <span>Jobs</span></button>
<button data-page="schedule">◷ <span>Schedule</span></button>
<button data-page="estimates">▤ <span>Estimates</span></button>
<button data-page="invoices">$ <span>Invoices</span></button>
<button data-page="customers">⌂ <span>Customers</span></button>
<button data-page="employees">♟ <span>Employees</span></button>
<button data-page="marketing">↗ <span>Marketing</span></button>
<button data-page="bookkeeping">▥ <span>Bookkeeping</span></button>
<button data-page="settings">⚙ <span>Settings</span></button>
</div>
<div class="bottom">AI Business Brain<br><strong>Online</strong> · Ready to act</div>
</aside>
<main class="main">
<header><input class="search" placeholder="Search customers, jobs, invoices…"><div class="user"><span>J&J Premier Landscaping</span><div class="avatar">JC</div></div></header>
<div class="content" id="appcontent"></div>
</main></div>
<div class="toast" id="toast"></div>
<script>
const state={
customers:[
{name:"John Smith",phone:"(973) 555-0182",property:"Wayne, NJ",status:"Active"},
{name:"Maria Rodriguez",phone:"(201) 555-0124",property:"Pompton Plains, NJ",status:"Active"},
{name:"Maple Ridge HOA",phone:"(973) 555-0111",property:"Pequannock, NJ",status:"Commercial"},
{name:"Tom Wilson",phone:"(973) 555-0190",property:"Lincoln Park, NJ",status:"Lead"}],
jobs:[
{name:"Weekly Lawn Maintenance",customer:"John Smith",crew:"Crew A",time:"8:00 AM",status:"In Progress",progress:62},
{name:"Spring Cleanup",customer:"Maria Rodriguez",crew:"Crew B",time:"10:30 AM",status:"Scheduled",progress:0},
{name:"Commercial Mowing",customer:"Maple Ridge HOA",crew:"Crew A",time:"1:00 PM",status:"Scheduled",progress:0},
{name:"Mulch Installation",customer:"Tom Wilson",crew:"Crew C",time:"3:30 PM",status:"Estimate",progress:0}],
estimates:[{customer:"Tom Wilson",service:"Mulch Installation",amount:1850,status:"Awaiting approval"},{customer:"Maple Ridge HOA",service:"Weekly Maintenance",amount:4200,status:"Draft"}],
invoices:[{customer:"John Smith",amount:285,status:"Paid"},{customer:"Maria Rodriguez",amount:640,status:"Due"},{customer:"Maple Ridge HOA",amount:4200,status:"Due"}]
};
function money(n){return "$"+Number(n).toLocaleString()}
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.style.display="block";setTimeout(()=>t.style.display="none",2200)}
function shell(title,sub,body,button=""){return `<div class="title"><div><h1>${title}</h1><p>${sub}</p></div>${button}</div>${body}`}
function dashboard(){
return shell("Good morning, Joe.","Wednesday · September 2, 2026",`
<div class="heroai"><small>AI BUSINESS BRAIN</small><h2 style="margin:6px 0">What should J&J OS handle?</h2><div class="airow"><input id="aicmd" placeholder='Try “Create a workflow for new leads” or “Add a mulch service”'><button onclick="runAI()">Ask AI</button></div></div>
<div class="cards">
<div class="card"><div class="label">Revenue this month</div><div class="metric">$12,480</div><div class="sub">↑ 18.4% vs last month</div></div>
<div class="card"><div class="label">Active jobs</div><div class="metric">8</div><div class="sub">3 crews in field</div></div>
<div class="card"><div class="label">Open leads</div><div class="metric">17</div><div class="sub">6 need follow-up</div></div>
<div class="card"><div class="label">Outstanding</div><div class="metric">$4,260</div><div class="sub">2 invoices overdue</div></div>
</div>
<div class="grid">
<div class="section"><div class="sectionhead"><h3>Today's jobs</h3><button class="btn secondary" onclick="page('jobs')">View all</button></div>
${state.jobs.map(j=>`<div class="job"><div><div class="jobname">${j.name}</div><div class="sub">${j.customer} · ${j.crew} · ${j.time}</div></div><div><span class="pill ${j.status==='Scheduled'?'gray':''}">${j.status}</span>${j.progress?`<div class="sub" style="text-align:right">${j.progress}% complete</div>`:""}</div></div>`).join("")}</div>
<div class="section"><div class="sectionhead"><h3>Quick actions</h3></div><div class="actions">
<button class="action" onclick="page('estimates')"><b>＋ New Estimate</b><span class="sub">Build and send a proposal</span></button>
<button class="action" onclick="page('jobs')"><b>＋ Create Job</b><span class="sub">Schedule a crew</span></button>
<button class="action" onclick="page('crm')"><b>＋ Add Customer</b><span class="sub">Import or create a contact</span></button>
<button class="action" onclick="toast('AI follow-up queue created')"><b>✦ AI Follow-ups</b><span class="sub">6 leads need attention</span></button>
</div></div></div>`);
}
function crm(){return shell("CRM","Every customer, lead, property and conversation in one place.",`<div class="section"><div class="toolbar"><input id="custsearch" placeholder="Search customers…" oninput="filterCustomers()"><button class="btn" onclick="toast('Customer form opened')">＋ Add customer</button></div><table class="table" id="custtable"><tr><th>Customer</th><th>Phone</th><th>Property</th><th>Status</th><th></th></tr>${state.customers.map((c,i)=>`<tr><td><b>${c.name}</b></td><td>${c.phone}</td><td>${c.property}</td><td><span class="pill">${c.status}</span></td><td><button class="btn secondary" onclick="toast('Opened ${c.name}')">Open</button></td></tr>`).join("")}</table></div>`)}
function jobs(){return shell("Jobs","Dispatch work, track field progress and close the loop.",`<div class="section"><div class="toolbar"><select><option>All crews</option><option>Crew A</option><option>Crew B</option></select><select><option>All statuses</option><option>Scheduled</option><option>In Progress</option></select><button class="btn" onclick="toast('New job created')">＋ New job</button></div>${state.jobs.map((j,i)=>`<div class="job"><div><div class="jobname">${j.name}</div><div class="sub">${j.customer} · ${j.time} · ${j.crew}</div></div><div style="text-align:right"><span class="pill">${j.status}</span><div style="margin-top:8px;width:150px;background:#e8eeea;height:6px;border-radius:8px"><div style="width:${j.progress}%;height:100%;background:#16734a;border-radius:8px"></div></div><button class="btn secondary" style="margin-top:8px" onclick="openJob(${i})">Open job</button></div></div>`).join("")}</div>`)}
function openJob(i){let j=state.jobs[i];document.getElementById("appcontent").innerHTML=shell(j.name,j.customer,`<div class="grid"><div class="section"><div class="sectionhead"><h3>Field workflow</h3><span class="pill">${j.status}</span></div><div class="formgrid"><div class="field"><label>Crew</label><input value="${j.crew}"></div><div class="field"><label>Scheduled</label><input value="${j.time}"></div><div class="field full"><label>Progress</label><input type="range" min="0" max="100" value="${j.progress}" oninput="this.nextElementSibling.textContent=this.value+'%'"><b>${j.progress}%</b></div><div class="field full"><label>Field notes</label><textarea rows="4" placeholder="Crew notes, materials, customer requests…"></textarea></div></div><div style="padding:0 18px 18px"><button class="btn" onclick="completeJob(${i})">✓ Mark job complete</button> <button class="btn secondary" onclick="toast('Photo uploader opened')">＋ Add photos</button></div></div><div class="section"><div class="sectionhead"><h3>AI job assistant</h3></div><div style="padding:20px"><p><b>Suggested next action</b></p><p class="sub">When the crew finishes, generate the completion summary, attach photos, notify the customer and prepare the invoice.</p><button class="btn" onclick="toast('Completion workflow armed')">Enable workflow</button></div></div></div>`)}
function completeJob(i){state.jobs[i].status="Completed";state.jobs[i].progress=100;toast("Job completed · customer notification queued");page("jobs")}
function estimates(){return shell("Estimates","Price jobs, send proposals and turn approvals into work.",`<div class="grid"><div class="section"><div class="sectionhead"><h3>Estimates</h3><button class="btn" onclick="newEstimate()">＋ New estimate</button></div>${state.estimates.map(e=>`<div class="job"><div><div class="jobname">${e.service}</div><div class="sub">${e.customer}</div></div><div style="text-align:right"><b>${money(e.amount)}</b><div><span class="pill">${e.status}</span></div></div></div>`).join("")}</div><div class="section"><div class="sectionhead"><h3>AI estimating</h3></div><div style="padding:20px"><p>Describe the job and J&J OS can draft the estimate using your pricebook, labor assumptions and materials.</p><button class="btn" onclick="toast('AI estimator opened')">Try AI estimator</button></div></div></div>`)}
function newEstimate(){document.getElementById("appcontent").innerHTML=shell("New Estimate","Build a branded proposal.",`<div class="section"><div class="formgrid"><div class="field"><label>Customer</label><select><option>Tom Wilson</option><option>John Smith</option></select></div><div class="field"><label>Service</label><input value="Mulch Installation"></div><div class="field"><label>Labor</label><input id="labor" type="number" value="650" oninput="calc()"></div><div class="field"><label>Materials</label><input id="materials" type="number" value="900" oninput="calc()"></div><div class="field full"><label>Scope</label><textarea rows="4">Install mulch in front and rear beds, edge beds, clean up debris.</textarea></div></div><div class="total">Total: <span id="total">$1,550</span></div><div style="padding:0 18px 20px"><button class="btn" onclick="toast('Estimate saved and ready to send')">Save & send</button></div></div>`)}
function calc(){let a=+document.getElementById("labor").value||0,b=+document.getElementById("materials").value||0;document.getElementById("total").textContent=money(a+b)}
function simple(title,sub,content){return shell(title,sub,`<div class="section">${content}</div>`)}
function invoices(){return simple("Invoices","Billing, collections and payment status.",`<table class="table"><tr><th>Customer</th><th>Amount</th><th>Status</th><th></th></tr>${state.invoices.map(x=>`<tr><td><b>${x.customer}</b></td><td>${money(x.amount)}</td><td><span class="pill ${x.status==='Due'?'orange':''}">${x.status}</span></td><td><button class="btn secondary" onclick="toast('Invoice opened')">Open</button></td></tr>`).join("")}</table>`)}
function customers(){return crm()}
function employees(){return simple("Employees & permissions","Give every person exactly the access they need.",`<div class="job"><div><b>Joe Colon</b><div class="sub">Owner · Full access</div></div><span class="pill">Owner</span></div><div class="job"><div><b>Office Admin</b><div class="sub">CRM · Estimates · Invoices · Scheduling</div></div><span class="pill">Admin</span></div><div class="job"><div><b>Crew Manager</b><div class="sub">Jobs · Time · Photos · Materials · Customers</div></div><span class="pill">Manager</span></div><div class="job"><div><b>Field Technician</b><div class="sub">Assigned jobs · Clock in/out · Notes · Photos</div></div><span class="pill">Field</span></div><div style="padding:18px"><button class="btn" onclick="toast('Employee invitation created')">＋ Invite employee</button></div>`)}
function marketing(){return simple("Marketing","Turn leads into booked revenue and measure the full funnel.",`<div class="job"><div><b>Meta lead campaigns</b><div class="sub">Leads → AI qualification → CRM → estimate → job revenue</div></div><span class="pill">Connected</span></div><div class="job"><div><b>AI follow-up engine</b><div class="sub">Automatically follows up with new leads until booked or disqualified.</div></div><button class="btn secondary" onclick="toast('Follow-up rules opened')">Configure</button></div><div class="job"><div><b>ROI attribution</b><div class="sub">Prototype: connect ad spend to closed jobs and revenue.</div></div><span class="pill gray">Setup</span></div>`)}
function bookkeeping(){return simple("Bookkeeping","Financial operations with QuickBooks as the accounting system of record.",`<div class="job"><div><b>QuickBooks Online</b><div class="sub">Customers · services · estimates · invoices · payments · expenses</div></div><button class="btn" onclick="toast('QuickBooks connection flow opened')">Connect</button></div><div class="job"><div><b>Job profitability</b><div class="sub">Revenue − labor − materials − subcontractors = gross job margin.</div></div><span class="pill">AI ready</span></div>`)}
function schedule(){return simple("Schedule & Dispatch","Plan crews around time, location, skills and job requirements.",`<div style="padding:20px"><div class="cards"><div class="card"><div class="label">Crew A</div><div class="metric">3</div><div class="sub">jobs today</div></div><div class="card"><div class="label">Crew B</div><div class="metric">2</div><div class="sub">jobs today</div></div><div class="card"><div class="label">Crew C</div><div class="metric">1</div><div class="sub">jobs today</div></div><div class="card"><div class="label">Unassigned</div><div class="metric">2</div><div class="sub">need dispatch</div></div></div><p style="margin-top:25px"><button class="btn" onclick="toast('AI dispatch optimization started')">✦ Optimize schedule with AI</button></p></div>`)}
function settings(){return simple("Business Settings","Configure the software around how J&J actually operates.",`<div class="formgrid"><div class="field"><label>Business name</label><input value="J&J Premier Landscaping LLC"></div><div class="field"><label>Primary industry</label><input value="Landscaping & Property Services"></div><div class="field"><label>Brand color</label><input value="#16734a"></div><div class="field"><label>Invoice terms</label><select><option>Due on receipt</option><option>Net 15</option><option>Net 30</option></select></div><div class="field full"><label>Business rules for AI</label><textarea rows="5">Never schedule two crews at the same property. Snow jobs over 8 inches require the snow clause. Commercial estimates require owner approval before sending.</textarea></div></div><div style="padding:0 18px 20px"><button class="btn" onclick="toast('Business configuration saved')">Save configuration</button></div>`)}
function runAI(){let q=document.getElementById("aicmd").value||"business workflow";toast("AI: analyzing “"+q+"” · configuration draft created")}
function filterCustomers(){let q=document.getElementById("custsearch").value.toLowerCase();document.querySelectorAll("#custtable tr").forEach((r,i)=>{if(i===0)return;r.style.display=r.textContent.toLowerCase().includes(q)?"":"none"})}
const pages={dashboard,crm,jobs,schedule,estimates,invoices,customers,employees,marketing,bookkeeping,settings};
function page(name){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===name));document.getElementById("appcontent").innerHTML=pages[name]()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>page(b.dataset.page));page("dashboard");
</script>
</body>
</html>
