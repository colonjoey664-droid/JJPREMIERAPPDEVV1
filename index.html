<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>J&J OS — Business Command Center</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f7;color:#17211c;font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif}
button,input{font:inherit}.app{display:flex;min-height:100vh}.sidebar{width:240px;background:#101815;color:#c8d2cd;padding:20px 14px;position:fixed;top:0;bottom:0;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:8px 10px 28px;color:#fff;font-weight:800;font-size:17px}.mark{width:34px;height:34px;border-radius:10px;background:#39b878;display:grid;place-items:center;color:#082117;font-weight:900}
.nav{display:grid;gap:4px}.nav button{border:0;background:none;color:#9eaba5;text-align:left;padding:11px 12px;border-radius:9px}.nav button.active,.nav button:hover{background:#1b2b24;color:#fff}.nav i{font-style:normal;width:26px;display:inline-block}
.sidebottom{margin-top:auto;border-top:1px solid #26352e;padding:15px 8px;font-size:12px;color:#82928a}.online{color:#59d08f;margin-top:5px}
main{margin-left:240px;width:calc(100% - 240px)}header{height:72px;background:#fff;border-bottom:1px solid #e5e9e6;display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:3}
.search{width:320px;border:1px solid #e0e6e2;border-radius:9px;padding:10px 13px;background:#fafbfa}.headright{display:flex;align-items:center;gap:18px;font-size:13px}.avatar{width:34px;height:34px;border-radius:50%;background:#dff4e8;color:#167447;display:grid;place-items:center;font-weight:800}
.wrap{padding:30px;max-width:1450px;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:25px}.eyebrow{text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:#77857e;font-weight:800}.top h1{font-size:30px;margin:5px 0 4px;letter-spacing:-.03em}.sub{color:#748079;font-size:13px}.btn{border:0;border-radius:8px;background:#167447;color:white;padding:10px 15px;font-weight:750}.btn.light{background:#fff;color:#26332d;border:1px solid #dde4df}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric{background:#fff;border:1px solid #e4e9e6;border-radius:12px;padding:18px}.metric .num{font-size:27px;font-weight:800;margin:7px 0}.delta{font-size:12px;color:#168052}
.cols{display:grid;grid-template-columns:1.45fr .85fr;gap:16px;margin-top:16px}.panel{background:#fff;border:1px solid #e3e8e5;border-radius:12px;overflow:hidden}.ph{padding:16px 18px;border-bottom:1px solid #e8ece9;display:flex;justify-content:space-between;align-items:center}.ph h3{margin:0;font-size:15px}.job{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid #eef1ef}.job:last-child{border-bottom:0}.jobtitle{font-weight:750;font-size:14px}.meta{font-size:12px;color:#7a8781;margin-top:4px}.status{display:inline-block;padding:5px 8px;border-radius:99px;background:#e8f6ee;color:#147044;font-size:10px;font-weight:800}.status.gray{background:#eef1ef;color:#65716b}.status.amber{background:#fff3df;color:#966000}.bar{height:5px;background:#e7ece9;border-radius:99px;width:120px;margin-top:8px}.bar>span{display:block;height:100%;background:#2aa96b;border-radius:99px}
.ai{background:#10281d;color:#fff;border-radius:12px;padding:20px}.ai .eyebrow{color:#78b997}.ai h2{margin:6px 0;font-size:20px}.ai input{width:100%;padding:12px;border:1px solid #315142;border-radius:8px;background:#173328;color:#fff;outline:none;margin-top:13px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{background:#1d3b2d;border:1px solid #315442;color:#b9d7c8;border-radius:99px;padding:6px 9px;font-size:11px;cursor:pointer}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:14px}.quick button{background:#fafcfb;border:1px solid #e3e9e5;border-radius:9px;padding:13px;text-align:left}.quick b{display:block;font-size:13px;margin-bottom:3px}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:14px 17px;border-bottom:1px solid #edf0ee;text-align:left;font-size:13px}.table th{font-size:10px;text-transform:uppercase;color:#7d8983;letter-spacing:.08em}
.toolbar{display:flex;gap:9px;padding:14px;border-bottom:1px solid #e7ebe8}.toolbar input,.toolbar select{border:1px solid #dfe6e1;border-radius:8px;padding:9px;background:#fff}
.form{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{font-size:11px;font-weight:800;display:block;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #dfe5e1;border-radius:8px;background:#fff}.full{grid-column:1/-1}
.toast{position:fixed;right:24px;bottom:24px;background:#111c17;color:#fff;padding:12px 16px;border-radius:9px;display:none;box-shadow:0 10px 35px #0002}
@media(max-width:850px){.sidebar{width:68px;padding:15px 8px}.brand span,.nav button span{display:none}.nav button{text-align:center}.sidebottom{display:none}main{margin-left:68px;width:calc(100% - 68px)}header{padding:0 16px}.search{width:180px}.wrap{padding:18px}.grid4{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}.headright>span{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand"><div class="mark">J</div><span>J&J OS</span></div>
<div class="nav" id="nav">
<button class="active" data-p="home"><i>⌂</i><span>Command Center</span></button>
<button data-p="customers"><i>◉</i><span>Customers</span></button>
<button data-p="jobs"><i>✓</i><span>Jobs</span></button>
<button data-p="schedule"><i>◷</i><span>Dispatch</span></button>
<button data-p="estimates"><i>▤</i><span>Estimates</span></button>
<button data-p="invoices"><i>$</i><span>Invoices</span></button>
<button data-p="employees"><i>♙</i><span>Team</span></button>
<button data-p="marketing"><i>↗</i><span>Growth</span></button>
<button data-p="settings"><i>⚙</i><span>Settings</span></button>
</div>
<div class="sidebottom">J&J Premier Landscaping<div class="online">● AI Brain online</div></div>
</aside>
<main><header><input class="search" placeholder="Search anything…"><div class="headright"><span>Wednesday, Sep 2</span><div class="avatar">JC</div></div></header><div class="wrap" id="view"></div></main>
</div><div class="toast" id="toast"></div>
<script>
const data={
jobs:[
["Weekly Lawn Maintenance","John Smith","Crew A · 8:00 AM","In Progress",62],
["Spring Cleanup","Maria Rodriguez","Crew B · 10:30 AM","Scheduled",0],
["Commercial Mowing","Maple Ridge HOA","Crew A · 1:00 PM","Scheduled",0],
["Mulch Installation","Tom Wilson","Crew C · 3:30 PM","Estimate",0]],
customers:[
["John Smith","(973) 555-0182","Wayne, NJ","Active"],
["Maria Rodriguez","(201) 555-0124","Pompton Plains, NJ","Active"],
["Maple Ridge HOA","(973) 555-0111","Pequannock, NJ","Commercial"],
["Tom Wilson","(973) 555-0190","Lincoln Park, NJ","Lead"]]
};
function toast(x){let t=document.getElementById("toast");t.textContent=x;t.style.display="block";setTimeout(()=>t.style.display="none",2200)}
function layout(title,desc,body,action=""){return `<div class="top"><div><div class="eyebrow">J&J PREMIER LANDSCAPING</div><h1>${title}</h1><div class="sub">${desc}</div></div>${action}</div>${body}`}
function home(){return layout("Command Center","Everything happening in the business, in one view.",`
<div class="ai"><div class="eyebrow">BUSINESS BRAIN</div><h2>Tell J&J OS what you want done.</h2><input id="cmd" placeholder='“Follow up with every estimate over $1,000”'><div class="chips"><span class="chip" onclick="cmd('Find leads that need follow-up')">Find follow-ups</span><span class="chip" onclick="cmd('Optimize today’s schedule')">Optimize schedule</span><span class="chip" onclick="cmd('Show jobs losing money')">Find low-margin jobs</span><span class="chip" onclick="cmd('Create a new service')">Create a service</span></div></div>
<div class="grid4" style="margin-top:16px">
<div class="metric"><div class="eyebrow">Revenue · MTD</div><div class="num">$12,480</div><div class="delta">↑ 18.4% vs last month</div></div>
<div class="metric"><div class="eyebrow">Jobs · Today</div><div class="num">8</div><div class="sub">3 crews active</div></div>
<div class="metric"><div class="eyebrow">Pipeline</div><div class="num">$28,640</div><div class="sub">17 open leads</div></div>
<div class="metric"><div class="eyebrow">Receivables</div><div class="num">$4,260</div><div class="sub">2 overdue</div></div>
</div>
<div class="cols">
<div class="panel"><div class="ph"><h3>Today's operations</h3><button class="btn light" onclick="page('jobs')">View jobs</button></div>${data.jobs.map(j=>`<div class="job"><div><div class="jobtitle">${j[0]}</div><div class="meta">${j[1]} · ${j[2]}</div></div><div style="text-align:right"><span class="status ${j[3]=='Scheduled'?'gray':j[3]=='Estimate'?'amber':''}">${j[3]}</span>${j[4]?`<div class="bar"><span style="width:${j[4]}%"></span></div>`:""}</div></div>`).join("")}</div>
<div><div class="panel"><div class="ph"><h3>Quick actions</h3></div><div class="quick"><button onclick="page('estimates')"><b>＋ New estimate</b><span class="meta">Create a proposal</span></button><button onclick="page('jobs')"><b>＋ New job</b><span class="meta">Schedule work</span></button><button onclick="page('customers')"><b>＋ Customer</b><span class="meta">Add a contact</span></button><button onclick="toast('AI follow-up queue created')"><b>✦ AI follow-ups</b><span class="meta">6 need attention</span></button></div></div>
<div class="panel" style="margin-top:16px"><div class="ph"><h3>AI recommendations</h3></div><div class="job"><div><div class="jobtitle">3 estimates haven't been followed up</div><div class="meta">Potential value: $6,850</div></div><button class="btn light" onclick="toast('Follow-ups queued')">Act</button></div><div class="job"><div><div class="jobtitle">Crew A has 42 min of idle time</div><div class="meta">AI found a nearby open job</div></div><button class="btn light" onclick="toast('Schedule suggestion applied')">Review</button></div></div></div></div>`)}
function customers(){return layout("Customers","Your CRM, properties and service history.",`<div class="panel"><div class="toolbar"><input id="q" placeholder="Search customers…" oninput="filter()"><button class="btn" onclick="toast('Customer created')">＋ Add customer</button></div><table class="table" id="tbl"><tr><th>Customer</th><th>Phone</th><th>Property</th><th>Status</th><th></th></tr>${data.customers.map(c=>`<tr><td><b>${c[0]}</b></td><td>${c[1]}</td><td>${c[2]}</td><td><span class="status">${c[3]}</span></td><td><button class="btn light" onclick="toast('Customer profile opened')">Open</button></td></tr>`).join("")}</table></div>`)}
function jobs(){return layout("Jobs","Work orders from scheduled to completed.",`<div class="panel"><div class="toolbar"><select><option>All crews</option><option>Crew A</option><option>Crew B</option></select><select><option>All statuses</option><option>Scheduled</option><option>In Progress</option></select><button class="btn" onclick="toast('New job created')">＋ New job</button></div>${data.jobs.map((j,i)=>`<div class="job"><div><div class="jobtitle">${j[0]}</div><div class="meta">${j[1]} · ${j[2]}</div></div><div style="text-align:right"><span class="status ${j[3]=='Scheduled'?'gray':j[3]=='Estimate'?'amber':''}">${j[3]}</span><div><button class="btn light" style="margin-top:8px" onclick="job(${i})">Open</button></div></div></div>`).join("")}</div>`)}
function job(i){let j=data.jobs[i];document.getElementById("view").innerHTML=layout(j[0],j[1],`<div class="cols"><div class="panel"><div class="ph"><h3>Field workflow</h3><span class="status">${j[3]}</span></div><div class="form"><div class="field"><label>CREW</label><input value="${j[2].split(' · ')[0]}"></div><div class="field"><label>SCHEDULE</label><input value="${j[2].split(' · ')[1]}"></div><div class="field full"><label>PROGRESS</label><input type="range" min="0" max="100" value="${j[4]}"></div><div class="field full"><label>FIELD NOTES</label><textarea rows="5" placeholder="Crew notes, materials, customer requests…"></textarea></div></div><div style="padding:0 18px 18px"><button class="btn" onclick="toast('Job completed · invoice workflow queued')">✓ Complete job</button> <button class="btn light" onclick="toast('Photo upload opened')">＋ Photos</button></div></div><div class="panel"><div class="ph"><h3>AI next action</h3></div><div style="padding:20px"><b>When this job is completed:</b><p class="sub">Generate a completion summary → notify customer → attach photos → create invoice → request payment.</p><button class="btn" onclick="toast('Automation enabled')">Enable automation</button></div></div></div>`)}
function estimates(){return layout("Estimates","Price, present and win more work.",`<div class="panel"><div class="ph"><h3>Pipeline</h3><button class="btn" onclick="newEst()">＋ New estimate</button></div>${[["Tom Wilson","Mulch Installation","$1,850","Awaiting approval"],["Maple Ridge HOA","Weekly Maintenance","$4,200","Draft"],["Sarah Davis","Spring Cleanup","$780","Sent"]].map(e=>`<div class="job"><div><div class="jobtitle">${e[1]}</div><div class="meta">${e[0]}</div></div><div style="text-align:right"><b>${e[2]}</b><br><span class="status">${e[3]}</span></div></div>`).join("")}</div>`)}
function newEst(){document.getElementById("view").innerHTML=layout("New estimate","Build a proposal from your pricebook.",`<div class="panel"><div class="form"><div class="field"><label>CUSTOMER</label><input value="Tom Wilson"></div><div class="field"><label>SERVICE</label><input value="Mulch Installation"></div><div class="field"><label>LABOR</label><input id="l" type="number" value="650" oninput="total()"></div><div class="field"><label>MATERIALS</label><input id="m" type="number" value="900" oninput="total()"></div><div class="field full"><label>SCOPE OF WORK</label><textarea rows="5">Install mulch in front and rear beds, edge beds, clean up debris.</textarea></div></div><div style="padding:0 18px 18px;text-align:right;font-size:24px;font-weight:800">Total <span id="tot">$1,550</span></div><div style="padding:0 18px 20px"><button class="btn" onclick="toast('Estimate saved and ready to send')">Save & send</button></div></div>`)}
function total(){document.getElementById("tot").textContent="$"+((+l.value||0)+(+m.value||0)).toLocaleString()}
function schedule(){return layout("Dispatch","Put the right crew on the right job.",`<div class="grid4"><div class="metric"><div class="eyebrow">Crew A</div><div class="num">3</div><div class="sub">jobs</div></div><div class="metric"><div class="eyebrow">Crew B</div><div class="num">2</div><div class="sub">jobs</div></div><div class="metric"><div class="eyebrow">Crew C</div><div class="num">1</div><div class="sub">job</div></div><div class="metric"><div class="eyebrow">Unassigned</div><div class="num">2</div><div class="sub">need dispatch</div></div></div><div class="panel" style="margin-top:16px"><div class="ph"><h3>AI dispatch</h3><button class="btn" onclick="toast('AI optimized routes and assignments')">✦ Optimize</button></div><div class="job"><div><div class="jobtitle">Route efficiency</div><div class="meta">AI can reduce today's estimated drive time by 34 minutes.</div></div><span class="status">Opportunity</span></div></div>`)}
function invoices(){return layout("Invoices","Get paid and keep cash moving.",`<div class="panel"><table class="table"><tr><th>Customer</th><th>Amount</th><th>Status</th><th></th></tr>${[["John Smith","$285","Paid"],["Maria Rodriguez","$640","Due"],["Maple Ridge HOA","$4,200","Due"]].map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td><span class="status ${x[2]=='Due'?'amber':''}">${x[2]}</span></td><td><button class="btn light" onclick="toast('Invoice opened')">Open</button></td></tr>`).join("")}</table></div>`)}
function employees(){return layout("Team & permissions","Control exactly what each person can access.",`<div class="panel">${[["Joe Colon","Owner","Everything"],["Office Admin","Admin","CRM · Estimates · Invoices · Scheduling"],["Crew Manager","Manager","Jobs · Time · Photos · Materials"],["Field Technician","Field","Assigned jobs · Clock · Notes · Photos"]].map(x=>`<div class="job"><div><div class="jobtitle">${x[0]}</div><div class="meta">${x[2]}</div></div><span class="status">${x[1]}</span></div>`).join("")}<div style="padding:18px"><button class="btn" onclick="toast('Employee invite created')">＋ Invite employee</button></div></div>`)}
function marketing(){return layout("Growth","Leads, campaigns and revenue attribution.",`<div class="panel"><div class="job"><div><div class="jobtitle">Meta lead capture</div><div class="meta">Facebook / Instagram → AI qualification → CRM</div></div><span class="status">Ready</span></div><div class="job"><div><div class="jobtitle">AI lead follow-up</div><div class="meta">Automatically chase new leads until booked or closed.</div></div><button class="btn light" onclick="toast('Follow-up workflow opened')">Configure</button></div><div class="job"><div><div class="jobtitle">Campaign ROI</div><div class="meta">Connect ad spend to actual closed revenue.</div></div><span class="status gray">Setup</span></div></div>`)}
function settings(){return layout("Business configuration","Teach the system how J&J operates.",`<div class="panel"><div class="form"><div class="field"><label>BUSINESS NAME</label><input value="J&J Premier Landscaping LLC"></div><div class="field"><label>INDUSTRY</label><input value="Landscaping & Property Services"></div><div class="field full"><label>AI BUSINESS RULES</label><textarea rows="6">Snow jobs over 8 inches require the snow clause. Commercial estimates require owner approval. Never schedule two crews at the same property. Always attach completion photos to commercial jobs.</textarea></div></div><div style="padding:0 18px 20px"><button class="btn" onclick="toast('Business configuration saved')">Save configuration</button></div></div>`)}
function cmd(x){document.getElementById("cmd").value=x;toast("AI draft created for: "+x)}
function filter(){let q=document.getElementById("q").value.toLowerCase();document.querySelectorAll("#tbl tr").forEach((r,i)=>{if(i)r.style.display=r.textContent.toLowerCase().includes(q)?"":"none"})}
const pages={home,customers,jobs,schedule,estimates,invoices,employees,marketing,settings};
function page(p){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.p===p));document.getElementById("view").innerHTML=pages[p]()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>page(b.dataset.p));page("home");
</script>
</body></html>
